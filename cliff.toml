# git-cliff ~ configuration file
# https://git-cliff.org/docs/configuration
#
# Replaces github_changelog_generator (PR/label-driven, Ruby, GitHub API)
# with commit-driven parsing. Section names mirror the old generator's
# layout ("Implemented enhancements" / "Fixed bugs") so the output stays
# familiar. Historical unconventional commits fall through to "Other".

[remote.github]
owner = "javydreamercsw"
repo = "all-time-wrestling-rpg"
# Token is read from the GITHUB_TOKEN environment variable (CI sets this).
# Without it, PR numbers/authors are simply omitted from the output.

[changelog]
# A Tera template to be rendered as the changelog's header.
title = """# Changelog\n"""
# A Tera template to be rendered for each release in the changelog.
body = """
{% if version %}\
## [{{ version }}](https://github.com/javydreamercsw/all-time-wrestling-rpg/tree/{{ version }}) ({{ timestamp | date(format="%Y-%m-%d") }})
{% else %}\
## Unreleased
{% endif %}\
{% set total = commits | length %}\
{% set release_count = commits | filter(attribute="group", value="Release") | length %}\
{% set release_only = release_count == total %}\
{% for group, group_commits in commits | group_by(attribute="group") %}\
{% if group != "Release" or release_only %}\

### {{ group }}

{% for commit in group_commits %}\
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | trim }}\
{% if commit.remote.pr_number %} ([#{{ commit.remote.pr_number }}](https://github.com/javydreamercsw/all-time-wrestling-rpg/pull/{{ commit.remote.pr_number }})){% endif %}
{% endfor %}\
{% endif %}\
{% endfor %}\
{% if version %}\
{% if previous.version %}\
[Full Changelog](https://github.com/javydreamercsw/all-time-wrestling-rpg/compare/{{ previous.version }}...{{ version }})
{% endif %}\
{% endif %}\
"""
# Remove leading and trailing whitespaces from the changelog's body.
trim = true
# A Tera template to be rendered as the changelog's footer.
footer = """
<!-- generated by git-cliff -->
"""
# An array of regex based postprocessors to modify the changelog.
postprocessors = []

[git]
# Parse commits according to the conventional commits specification.
conventional_commits = true
# Keep unconventional commits (legacy history) — they land in "Other".
filter_unconventional = false
# Split commits on newlines, treating each line as an individual commit.
split_commits = false
# Regex-based parsers to modify commit messages prior to further processing.
commit_preprocessors = []
# Exclude commits that are not matched by any commit parser (drops the
# `skip = true` matches: merge commits and formatting noise).
filter_commits = true
# Order releases topologically instead of chronologically.
topo_order = false
# Order of commits in each group/release within the changelog.
sort_commits = "newest"
# Match this repository's tag format.
tag_pattern = "v[0-9].*"

commit_parsers = [
  { message = "^feat", group = "Implemented enhancements" },
  { message = "^fix", group = "Fixed bugs" },
  { message = "^perf", group = "Implemented enhancements" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^doc", group = "Documentation" },
  { message = "^test", group = "Tests" },
  # Release chore: version-bump commits between releases are noise.
  { message = "^Bump version from", skip = true },
  { message = "^Build", group = "Dependencies" },
  { message = "^build", group = "Dependencies" },
  { message = "^Bump", group = "Dependencies" },
  { message = "^deps", group = "Dependencies" },
  # Release-process and formatting noise — never useful in a changelog.
  { message = "^Merge", skip = true },
  { message = "^style", skip = true },
  { message = "^experiment", skip = true },
  { message = "^chore\\(release", skip = true },
  { message = "^chore\\(version", skip = true },
  { message = "Update version to", group = "Release" },
  { message = "Merge release", group = "Release" },
  { message = "Sync main back to release", group = "Release" },
  { message = "Update dependencies", skip = true },
  { message = "Rewrite fixes", skip = true },
  { message = "^chore", group = "Miscellaneous" },
  { message = "^ci", group = "Miscellaneous" },
  # Catch-all for legacy/historical commits (per the migration guide).
  { message = ".*", group = "Other" },
]
