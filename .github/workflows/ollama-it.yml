name: Ollama Integration Tests

on:
  schedule:
    - cron: '0 3 * * *'  # 3 AM UTC nightly
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run against'
        required: false
        default: 'release/2.9.0'

permissions:
  contents: read

jobs:
  ollama-it:
    # Ollama coverage tracks the release line, not main — main can drift from
    # what ships. The nightly runs against the active release branch.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || 'release/2.9.0' }}

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache Ollama models
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-models-llama3.2-1b
          restore-keys: ollama-models-

      - name: Install Ollama
        run: curl -fsSL https://ollama.ai/install.sh | sh

      - name: Start Ollama server
        run: |
          ollama serve &
          sleep 8

      - name: Pull llama3.2:1b model
        run: ollama pull llama3.2:1b

      - name: Run Ollama integration tests
        env:
          OLLAMA_BASE_URL: http://localhost:11434
          OLLAMA_MODEL: llama3.2:1b
          OLLAMA_TIMEOUT_SECONDS: 300
        run: >
          mvn -Pintegration-test verify
          "-Dit.test=OllamaSegmentNarrationServiceIT,FeudBeatAssistantOllamaIT"
          -Dsurefire.skip=true
          -DrerunFailingTestsCount=2
          --no-transfer-progress
