name: Ollama Integration Tests

on:
  schedule:
    - cron: '0 3 * * *'  # 3 AM UTC nightly
  workflow_dispatch:
    inputs:
      branch:
        description: 'Single release/* branch to run against (empty = all release/* branches)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  # Discover every release/* branch (release-line coverage tracks what ships,
  # not main). A manual dispatch may pin one branch instead.
  discover:
    runs-on: ubuntu-latest
    outputs:
      branches: ${{ steps.list.outputs.branches }}
    steps:
      - name: List release branches
        id: list
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ github.event.inputs.branch }}" ]; then
            branches='["${{ github.event.inputs.branch }}"]'
          else
            branches=$(gh api repos/${{ github.repository }}/branches --paginate \
              --jq '[.[] | .name | select(startswith("release/"))] | unique')
          fi
          echo "branches=$branches" >> "$GITHUB_OUTPUT"

  ollama-it:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJson(needs.discover.outputs.branches) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.branch }}

      # No caches in this workflow (neither setup-java's maven cache nor
      # actions/cache): this job checks out arbitrary release branches in a
      # default-branch (schedule/dispatch) context, and any cache saved from
      # untrusted code is the cache-poisoning vector CodeQL flags
      # (actions/cache-poisoning/poisonable-step). Cold Maven downloads add a
      # couple of minutes to a nightly job — an acceptable price.
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Install Ollama
        run: curl -fsSL https://ollama.ai/install.sh | sh

      - name: Start Ollama server
        run: |
          ollama serve &
          sleep 8

      - name: Pull llama3.2:1b model
        run: ollama pull llama3.2:1b

      - name: Run Ollama integration tests
        env:
          OLLAMA_BASE_URL: http://localhost:11434
          OLLAMA_MODEL: llama3.2:1b
          OLLAMA_TIMEOUT_SECONDS: 300
        run: >
          mvn -Pintegration-test verify
          -Dit.groups=ollama
          -Dsurefire.skip=true
          -DrerunFailingTestsCount=2
          --no-transfer-progress
