name: Redeploy Docs

# Rebuilds and redeploys the GitHub Pages docs site without re-running any
# E2E or screenshot tests. Both screenshots and videos are gitignored, so
# each must be supplied from a prior release run's artifacts — otherwise
# VitePress fails on unresolved /screenshots/*.png imports (screenshots) or
# the site deploys without walkthrough videos (videos).
#
# Usage:
#   Trigger this workflow with the ref to deploy. Artifact run IDs are
#   optional: when left blank, the most recent successful "Create Release"
#   run that produced each artifact is used automatically. Pass an explicit
#   run ID only to pin an older release's screenshots/videos.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag to check out (e.g. release/2.0.0)'
        required: true
        default: 'main'
      videos_run_id:
        description: 'Release run ID for docs-videos (blank = latest successful release run with that artifact)'
        required: false
        default: ''
      screenshots_run_id:
        description: 'Release run ID for docs-screenshots (blank = latest successful release run with that artifact)'
        required: false
        default: ''

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.ref }}

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install root dependencies
        run: npm install --legacy-peer-deps

      - name: Install docs site dependencies
        run: npm ci
        working-directory: docs/site

      - name: "Resolve artifact run IDs (default: latest successful release run)"
        id: artifact_runs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          latest_with_artifact() {
            local artifact="$1"
            local explicit="$2"
            if [ -n "$explicit" ]; then
              echo "$explicit"
              return
            fi
            # Newest successful Create Release runs first; pick the first whose
            # named artifact still exists (artifacts expire after ~90 days).
            # A for-loop (not `while read`) — the pipeline subshell would swallow
            # the return and could echo multiple IDs.
            local run_ids
            mapfile -t run_ids < <(gh api --paginate "repos/${{ github.repository }}/actions/workflows/release.yml/runs?status=success&per_page=30" --jq '.workflow_runs[].id')
            local run_id
            for run_id in "${run_ids[@]}"; do
              if gh api "repos/${{ github.repository }}/actions/runs/${run_id}/artifacts" \
                  --jq ".artifacts[] | select(.name == \"${artifact}\") | .name" | grep -q .; then
                echo "$run_id"
                return
              fi
            done
          }

          VIDEOS_RUN="$(latest_with_artifact docs-videos "${{ github.event.inputs.videos_run_id }}")"
          SCREENS_RUN="$(latest_with_artifact docs-screenshots "${{ github.event.inputs.screenshots_run_id }}")"
          echo "videos_run=$VIDEOS_RUN" >> "$GITHUB_OUTPUT"
          echo "screens_run=$SCREENS_RUN" >> "$GITHUB_OUTPUT"
          echo "docs-videos from run:    ${VIDEOS_RUN:-<none found>}"
          echo "docs-screenshots from run: ${SCREENS_RUN:-<none found>}"

      - name: Download docs-videos artifact from release run
        if: ${{ steps.artifact_runs.outputs.videos_run != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Download to a temp dir to avoid conflicts with any existing files
          # in the workspace (e.g. git-committed videos/).
          gh run download ${{ steps.artifact_runs.outputs.videos_run }} \
            --name docs-videos \
            --dir /tmp/videos-artifact

      - name: Normalize video artifact structure
        if: ${{ steps.artifact_runs.outputs.videos_run != '' }}
        run: |
          mkdir -p docs/videos
          # Artifact structure varies by when the release ran:
          #   pre-fix:  /tmp/videos-artifact/videos/<file>.mp4  (trailing-slash upload stripped docs/)
          #   post-fix: /tmp/videos-artifact/docs/videos/<file>.mp4
          if find /tmp/videos-artifact/docs/videos -name '*.mp4' -maxdepth 1 | grep -q .; then
            echo "Post-fix artifact: copying from docs/videos/"
            find /tmp/videos-artifact/docs/videos -name '*.mp4' -maxdepth 1 -exec cp {} docs/videos/ \;
            [ -f /tmp/videos-artifact/docs/video-manifest.json ] && cp /tmp/videos-artifact/docs/video-manifest.json docs/
          elif find /tmp/videos-artifact/videos -name '*.mp4' -maxdepth 1 | grep -q .; then
            echo "Pre-fix artifact: copying from videos/"
            find /tmp/videos-artifact/videos -name '*.mp4' -maxdepth 1 -exec cp {} docs/videos/ \;
            [ -f /tmp/videos-artifact/video-manifest.json ] && cp /tmp/videos-artifact/video-manifest.json docs/
          else
            echo "No MP4s found in artifact — deploying without videos"
          fi
          echo "Videos in docs/videos/: $(find docs/videos -name '*.mp4' | wc -l)"

      # Screenshots are gitignored (/docs/screenshots/), so a redeploy from a clean
      # checkout has none and VitePress fails with unresolved /screenshots/*.png
      # imports on the guide pages. Pull them from a release run's artifact — the
      # same place the release pipeline itself generated them.
      - name: Download docs-screenshots artifact from release run
        if: ${{ steps.artifact_runs.outputs.screens_run != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download ${{ steps.artifact_runs.outputs.screens_run }} \
            --name docs-screenshots \
            --dir /tmp/screens-artifact

      - name: Normalize screenshot artifact structure
        if: ${{ steps.artifact_runs.outputs.screens_run != '' }}
        run: |
          mkdir -p docs/screenshots
          # Artifact structure varies by when the release ran:
          #   pre-fix:  /tmp/screens-artifact/screenshots/<file>.png + manifest.json
          #   post-fix: /tmp/screens-artifact/docs/screenshots/<file>.png
          if find /tmp/screens-artifact/docs/screenshots -name '*.png' -maxdepth 1 | grep -q .; then
            echo "Post-fix artifact: copying from docs/screenshots/"
            find /tmp/screens-artifact/docs/screenshots -name '*.png' -maxdepth 1 -exec cp {} docs/screenshots/ \;
            [ -f /tmp/screens-artifact/docs/manifest.json ] && cp /tmp/screens-artifact/docs/manifest.json docs/
          elif find /tmp/screens-artifact/screenshots -name '*.png' -maxdepth 1 | grep -q .; then
            echo "Pre-fix artifact: copying from screenshots/"
            find /tmp/screens-artifact/screenshots -name '*.png' -maxdepth 1 -exec cp {} docs/screenshots/ \;
            [ -f /tmp/screens-artifact/manifest.json ] && cp /tmp/screens-artifact/manifest.json docs/
          else
            echo "No PNGs found in artifact — deploying without screenshots"
          fi
          echo "Screenshots in docs/screenshots/: $(find docs/screenshots -name '*.png' | wc -l)"

      - name: Sync challenge content from src to docs
        run: node scripts/sync-challenge-content.cjs
        env:
          GITHUB_PAGES_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

      - name: Generate Markdown and build embedded docs
        run: node scripts/generate-docs.cjs
        env:
          GITHUB_PAGES_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

      - name: Build documentation for GitHub Pages
        run: npm run docs:build
        working-directory: docs/site
        env:
          BASE_URL: /${{ github.event.repository.name }}/

      - name: Create .nojekyll
        run: touch docs/site/.vitepress/dist/.nojekyll

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/site/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
