# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information, see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches:
      - 'main'
    tags:
      - 'v*.*.*'

  pull_request:
    branches:
      - '**'

permissions:
  contents: read
  actions: read
  security-events: write

# Prevent duplicate runs when a push to release/** also syncs an open PR.
# Each PR gets its own concurrency slot (keyed by PR number); direct pushes to
# main/tags get their own slot (keyed by ref). New pushes cancel in-progress runs
# within the same slot, so back-to-back commits to the same branch don't pile up.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-paths:
    runs-on: ubuntu-latest
    # Skip the test pipeline for direct pushes to release/** branches — a PR event
    # for the release→main PR already runs the full suite on the same commit. The
    # docker-image-release-branch job (below) is not gated on check-paths, so it
    # still fires on every push to release/** regardless of this condition.
    if: >-
      github.event_name == 'pull_request' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/heads/release/') ||
      startsWith(github.ref, 'refs/tags/')
    # NOTE: docker-image-release-branch / docker-image-main-release (below) are gated on
    # build-and-unit-test, integration-tests, and docker-it succeeding (or being legitimately
    # skipped) — see their `if:` conditions — so they no longer fire independently of test results.
    outputs:
      code_changed: ${{ steps.filter.outputs.code_changed }}
      deps_changed: ${{ steps.filter.outputs.deps_changed }}
      mysql_migration_changed: ${{ steps.filter.outputs.mysql_migration_changed }}
      ui_changed: ${{ steps.filter.outputs.ui_changed }}
      service_changed: ${{ steps.filter.outputs.service_changed }}
      db_changed: ${{ steps.filter.outputs.db_changed }}
      docs_changed: ${{ steps.filter.outputs.docs_changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          # need the history so we can diff against the base commit (PR base or previous run/commit)
          fetch-depth: 0

      - name: Determine base commit for comparison (PR base / previous push commit)
        id: determine_base
        run: |
          set -euo pipefail

          # For PR events: use the PR base SHA so we only check files changed by the PR.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Using PR base SHA"
            echo "base=${{ github.event.pull_request.base.sha }}" >> $GITHUB_OUTPUT
            exit 0
          fi

          # For push events: compare against the immediately preceding commit so the
          # filter reflects only what THIS push changed. Using "last successful run" as
          # the base caused spanning: a workflow-only push would diff against an older
          # SHA that included source changes, making code_changed spuriously true and
          # triggering expensive build/test jobs unnecessarily.
          PREV="${{ github.event.before }}"
          if [ -n "$PREV" ] && [ "$PREV" != "0000000000000000000000000000000000000000" ]; then
            echo "base=$PREV" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Final fallback: new branch / first push with no prior commit.
          echo "No prior commit available — falling back to origin/main"
          git fetch origin main:refs/remotes/origin/main --depth=1 || true
          echo "base=origin/main" >> $GITHUB_OUTPUT

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # For pull_request events, omit base so dorny uses its native PR merge-base
          # comparison — only the files the PR itself changed are flagged. Passing an
          # explicit SHA (github.event.pull_request.base.sha) can cause false positives
          # when the SHA is not in the shallow local checkout, which makes dorny fall back
          # to treating everything as changed (triggering rewrite-check / build jobs that
          # should be skipped for pom-only Dependabot bumps, for example).
          # For push events, compare against github.event.before (set by determine_base).
          base: ${{ github.event_name != 'pull_request' && steps.determine_base.outputs.base || '' }}
          filters: |
            code_changed:
              - 'src/**'
              - 'tsconfig.json'
              - 'vite.config.ts'
              - 'scripts/sync-vaadin-overrides.cjs'
            # Dependency/build-config bumps (e.g. Dependabot) — no Java/frontend source
            # changed, so build-and-unit-test still compiles/tests them, but
            # coverage-and-analysis (gated on code_changed only) is skipped since there's
            # no meaningful coverage delta to report.
            deps_changed:
              - 'pom.xml'
              - 'package.json'
              - 'package-lock.json'
            mysql_migration_changed:
              - 'src/main/resources/db/migration/mysql/**'
            # UI/frontend changes — gates E2E jobs (Chrome + Spring Boot startup are expensive)
            ui_changed:
              - 'src/main/java/**/ui/**'
              - 'src/main/java/**/view/**'
              - 'src/frontend/**'
              - 'src/main/resources/META-INF/resources/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.json'
              - 'vite.config.ts'
            # Backend service/domain/API changes — gates integration tests
            service_changed:
              - 'src/main/java/**/service/**'
              - 'src/main/java/**/repository/**'
              - 'src/main/java/**/domain/**'
              - 'src/main/java/**/rest/**'
              - 'src/main/java/**/controller/**'
            # DB migration changes — also gates integration tests
            db_changed:
              - 'src/main/resources/db/**'
            # Docs site changes — gates VitePress build validation
            docs_changed:
              - 'docs/site/**'

  rewrite-check:
    needs: check-paths
    if: needs.check-paths.outputs.code_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Cache Maven packages
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Clear OpenRewrite POM cache (prevents stale RocksDB deserialization errors)
        run: rm -rf ~/.rewrite-cache ~/.rewrite ~/.m2/repository/.rewrite
      - name: OpenRewrite dry-run (fail if changes needed)
        run: mvn -B rewrite:dryRun

  build-and-unit-test:
    needs: [check-paths]
    if: needs.check-paths.outputs.code_changed == 'true' || needs.check-paths.outputs.deps_changed == 'true'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
    - name: Cache Maven packages
      uses: actions/cache@v5
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    - name: Run unit tests with coverage and verify WAR packaging
      # Single Maven invocation: compile once, run tests, then package WAR.
      # Previously two separate invocations caused a full recompile in the WAR step (~3-5 min wasted).
      run: mvn -B package -Pwar,coverage -DnvdApiKey=${{ secrets.NVD_API }}

    - name: Upload unit test coverage data
      uses: actions/upload-artifact@v7
      with:
        name: jacoco-exec
        path: target/jacoco.exec
        if-no-files-found: error

  integration-tests:
    runs-on: ubuntu-latest
    needs: [check-paths, build-and-unit-test]
    if: needs.check-paths.outputs.service_changed == 'true' || needs.check-paths.outputs.db_changed == 'true'
    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
    - name: Cache Maven packages
      uses: actions/cache@v5
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    - name: Run Integration Tests
      run: |
        # If a committed MySQL snapshot exists for the current .released version,
        # pass it to FlywayMigrationIT so the prod-dump upgrade path is also tested.
        # The snapshot is generated by GenerateMysqlSnapshotIT during the release workflow
        # and committed to src/test/resources/db/. On the first run before the initial
        # snapshot is committed, this step gracefully falls back to the fresh-schema test only.
        RELEASED=$(cat src/main/resources/db/migration/mysql/.released | tr -d '[:space:]')
        VERSION=$(echo "$RELEASED" | sed 's/[^0-9]//g')
        SNAPSHOT="src/test/resources/db/mysql-snapshot-v${VERSION}.sql"
        if [ -f "$SNAPSHOT" ]; then
          echo "MySQL snapshot found: $SNAPSHOT — enabling prod-dump migration test"
          mvn -B verify -Pintegration-test,coverage -Dsurefire.skip=true "-Dprod.dump.file=${SNAPSHOT}"
        else
          echo "MySQL snapshot not yet committed (expected: $SNAPSHOT) — running fresh-schema test only"
          mvn -B verify -Pintegration-test,coverage -Dsurefire.skip=true
        fi

    - name: Upload integration test coverage data
      uses: actions/upload-artifact@v7
      with:
        name: jacoco-it-exec
        path: target/jacoco-it.exec
        if-no-files-found: error

  # Build the Vaadin production frontend bundle once and share it with all E2E jobs.
  # Running `mvn package -Pproduction` in each E2E job independently costs ~10-15 min
  # per job (Vite/Node build). This job runs in parallel with build-and-unit-test so it
  # does not extend the critical path.
  build-frontend:
    runs-on: ubuntu-latest
    needs: [check-paths]
    if: needs.check-paths.outputs.ui_changed == 'true' && github.event_name == 'pull_request'
    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
    - name: Cache Maven packages
      uses: actions/cache@v5
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-
    - name: Build production frontend bundle
      run: mvn -B package -Pproduction -DskipTests
    - name: Upload Vaadin bundle
      uses: actions/upload-artifact@v7
      with:
        name: vaadin-frontend-bundle
        path: target/classes/META-INF/VAADIN/
        if-no-files-found: error

  e2e-tests:
    runs-on: ubuntu-latest
    needs: [check-paths, build-and-unit-test, build-frontend]
    if: needs.check-paths.outputs.ui_changed == 'true' && github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      HEADLESS: 'true'
      GITHUB_ACTIONS: 'true'
    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
    - name: Cache Maven packages
      uses: actions/cache@v5
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-
    - name: Set up Chrome
      uses: browser-actions/setup-chrome@v2
    - name: Download Vaadin bundle
      uses: actions/download-artifact@v8
      with:
        name: vaadin-frontend-bundle
        path: target/classes/META-INF/VAADIN/
    - name: Run E2E Tests (shard ${{ matrix.shard }} of 2)
      run: >-
        mvn -B verify -Pe2e,coverage,production -Dsurefire.skip=true
        -De2e.shard.index=${{ matrix.shard }} -De2e.shard.total=2
        -Djacoco.e2e.destFile=target/jacoco-e2e-${{ matrix.shard }}.exec
    - name: Upload E2E test failure artifacts
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: e2e-test-failures-${{ matrix.shard }}
        path: target/test-failures
    - name: Upload E2E test coverage data
      uses: actions/upload-artifact@v7
      with:
        name: jacoco-e2e-exec-${{ matrix.shard }}
        path: target/jacoco-e2e-${{ matrix.shard }}.exec
        if-no-files-found: ignore
  
  docs-e2e-tests:
    runs-on: ubuntu-latest
    needs: [check-paths, build-and-unit-test, build-frontend]
    if: needs.check-paths.outputs.ui_changed == 'true' && github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      HEADLESS: 'true'
      GITHUB_ACTIONS: 'true'
    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
    - name: Cache Maven packages
      uses: actions/cache@v5
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-
    - name: Set up Chrome
      uses: browser-actions/setup-chrome@v2
    - name: Download Vaadin bundle
      uses: actions/download-artifact@v8
      with:
        name: vaadin-frontend-bundle
        path: target/classes/META-INF/VAADIN/
    - name: Run Docs E2E Tests (shard ${{ matrix.shard }} of 2)
      run: >-
        mvn -B verify -Pdocs-e2e,coverage,production -Dsurefire.skip=true
        -De2e.shard.index=${{ matrix.shard }} -De2e.shard.total=2
        -Djacoco.docs-e2e.destFile=target/jacoco-docs-e2e-${{ matrix.shard }}.exec
    - name: Upload Docs E2E test failure artifacts
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: docs-e2e-test-failures-${{ matrix.shard }}
        path: target/test-failures
    - name: Upload Docs E2E test coverage data
      uses: actions/upload-artifact@v7
      with:
        name: jacoco-docs-e2e-exec-${{ matrix.shard }}
        path: target/jacoco-docs-e2e-${{ matrix.shard }}.exec
        if-no-files-found: ignore

  validate-video-tests:
    runs-on: ubuntu-latest
    needs: [check-paths, build-and-unit-test, build-frontend]
    if: needs.check-paths.outputs.ui_changed == 'true' && github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      HEADLESS: 'true'
      GITHUB_ACTIONS: 'true'
    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
    - name: Cache Maven packages
      uses: actions/cache@v5
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-
    - name: Set up Chrome
      uses: browser-actions/setup-chrome@v2
    - name: Download Vaadin bundle
      uses: actions/download-artifact@v8
      with:
        name: vaadin-frontend-bundle
        path: target/classes/META-INF/VAADIN/
    - name: Validate video tests (shard ${{ matrix.shard }} of 2, dry run)
      run: >-
        mvn -B verify -Pvalidate-videos,production -Dsurefire.skip=true -Dheadless=true
        -De2e.shard.index=${{ matrix.shard }} -De2e.shard.total=2
    - name: Upload video test failure artifacts
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: validate-video-test-failures-${{ matrix.shard }}
        path: target/test-failures

  # Validate the VitePress docs site builds cleanly. Catches YAML frontmatter
  # corruption (from Spotless/Prettier or manual edits) before it reaches the
  # release workflow's assemble_docs job.
  validate-docs:
    runs-on: ubuntu-latest
    needs: [check-paths]
    if: needs.check-paths.outputs.docs_changed == 'true'
    steps:
      - uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: docs/site/package-lock.json
      - name: Install docs dependencies
        run: cd docs/site && npm install
      - name: Build VitePress docs
        run: cd docs/site && npm run docs:build

  coverage-and-analysis:
    runs-on: ubuntu-latest
    needs: [check-paths, rewrite-check, build-and-unit-test, integration-tests, e2e-tests, docs-e2e-tests, validate-video-tests]
    if: >-
      always() &&
      needs.check-paths.outputs.code_changed == 'true' &&
      (needs.rewrite-check.result == 'success' || needs.rewrite-check.result == 'skipped') &&
      needs.build-and-unit-test.result == 'success' &&
      (needs.integration-tests.result == 'success' || needs.integration-tests.result == 'skipped') &&
      (needs.e2e-tests.result == 'success' || needs.e2e-tests.result == 'skipped') &&
      (needs.docs-e2e-tests.result == 'success' || needs.docs-e2e-tests.result == 'skipped') &&
      (needs.validate-video-tests.result == 'success' || needs.validate-video-tests.result == 'skipped')
    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
    - name: Cache Maven packages
      uses: actions/cache@v5
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    - name: Download unit test coverage data
      uses: actions/download-artifact@v8
      with:
        name: jacoco-exec
        path: target/

    - name: Download integration test coverage data
      if: needs.integration-tests.result == 'success'
      uses: actions/download-artifact@v8
      with:
        name: jacoco-it-exec
        path: target/

    - name: Download E2E test coverage data
      if: needs.e2e-tests.result == 'success'
      uses: actions/download-artifact@v8
      with:
        pattern: jacoco-e2e-exec-*
        path: target/
        merge-multiple: true

    - name: Download Docs E2E test coverage data
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        pattern: jacoco-docs-e2e-exec-*
        path: target/
        merge-multiple: true

    - name: Ensure classes are compiled
      run: mvn -B compile -Pcoverage

    - name: Merge coverage data
      run: mvn -B jacoco:merge -Pcoverage

    - name: Generate merged coverage report
      run: mvn -B jacoco:report -Pcoverage -Djacoco.dataFile=target/jacoco-merged.exec -Djacoco.outputDirectory=target/site/jacoco-merged

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v6
      with:
        file: ./target/site/jacoco-merged/jacoco.xml
        flags: merged
        name: codecov-umbrella
        fail_ci_if_error: true
        token: ${{ secrets.CODECOV_TOKEN }}
        skip_validation: true

  # Verify the desktop installer builds cleanly on each supported OS.
  # Only runs on release branches and main — not on every feature-branch PR,
  # since installer creation (jpackage) is expensive and release-gate relevant.
  desktop-build:
    needs: [check-paths]
    if: >-
      needs.check-paths.outputs.code_changed == 'true' &&
      (startsWith(github.ref, 'refs/heads/release/') || startsWith(github.base_ref, 'release/') || startsWith(github.ref, 'refs/tags/'))
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Cache Maven packages
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Build desktop installer
        run: mvn -B package -Pdesktop -DskipTests -Dsurefire.skip=true

  # Build and push Docker image (no release profile) on release/* branches
  docker-image-release-branch:
    needs: [check-paths, rewrite-check, build-and-unit-test, integration-tests, docker-it, e2e-tests, docs-e2e-tests, validate-video-tests]
    # rewrite-check/build-and-unit-test/integration-tests/docker-it "skip" both when their
    # path filter doesn't apply AND when an upstream dependency fails (GitHub cascades failures
    # as skips). rewrite-check shares build-and-unit-test's skip condition (code_changed), so
    # including it closes that gap: a real rewrite-check failure surfaces as result == 'failure',
    # not 'skipped', and still blocks the image push. E2E jobs are included so the image is
    # never pushed before all E2E tests have completed and passed.
    if: >-
      always() &&
      needs.check-paths.outputs.code_changed == 'true' &&
      (startsWith(github.ref, 'refs/heads/release/') || startsWith(github.head_ref, 'release/')) &&
      (needs.rewrite-check.result == 'success' || needs.rewrite-check.result == 'skipped') &&
      (needs.build-and-unit-test.result == 'success' || needs.build-and-unit-test.result == 'skipped') &&
      (needs.integration-tests.result == 'success' || needs.integration-tests.result == 'skipped') &&
      (needs.docker-it.result == 'success' || needs.docker-it.result == 'skipped') &&
      (needs.e2e-tests.result == 'success' || needs.e2e-tests.result == 'skipped') &&
      (needs.docs-e2e-tests.result == 'success' || needs.docs-e2e-tests.result == 'skipped') &&
      (needs.validate-video-tests.result == 'success' || needs.validate-video-tests.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Cache Maven packages
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push Docker image (no release profile)
        run: |
          for attempt in 1 2 3; do
            mvn clean package jib:build -Pproduction -DskipTests=true && break || {
              if [ $attempt -lt 3 ]; then
                echo "Attempt $attempt failed (MANIFEST_BLOB_UNKNOWN race). Retrying in 15s..."
                sleep 15
              else
                echo "All 3 attempts failed."
                exit 1
              fi
            }
          done

  # Build and push Docker image with release profile on version tag
  docker-image-main-release:
    needs: [check-paths, rewrite-check, build-and-unit-test, integration-tests, docker-it, e2e-tests, docs-e2e-tests, validate-video-tests]
    if: >-
      always() &&
      needs.check-paths.outputs.code_changed == 'true' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) &&
      (needs.rewrite-check.result == 'success' || needs.rewrite-check.result == 'skipped') &&
      (needs.build-and-unit-test.result == 'success' || needs.build-and-unit-test.result == 'skipped') &&
      (needs.integration-tests.result == 'success' || needs.integration-tests.result == 'skipped') &&
      (needs.docker-it.result == 'success' || needs.docker-it.result == 'skipped') &&
      (needs.e2e-tests.result == 'success' || needs.e2e-tests.result == 'skipped') &&
      (needs.docs-e2e-tests.result == 'success' || needs.docs-e2e-tests.result == 'skipped') &&
      (needs.validate-video-tests.result == 'success' || needs.validate-video-tests.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Cache Maven packages
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push Docker image (release profile)
        run: |
          for attempt in 1 2 3; do
            mvn clean package jib:build -Prelease,production -DskipTests=true && break || {
              if [ $attempt -lt 3 ]; then
                echo "Attempt $attempt failed (MANIFEST_BLOB_UNKNOWN race). Retrying in 15s..."
                sleep 15
              else
                echo "All 3 attempts failed."
                exit 1
              fi
            }
          done

  docker-it:
    runs-on: ubuntu-latest
    needs: [check-paths, build-and-unit-test]
    if: needs.check-paths.outputs.service_changed == 'true' || needs.check-paths.outputs.db_changed == 'true' || needs.check-paths.outputs.ui_changed == 'true'
    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
    - name: Cache Maven packages
      uses: actions/cache@v5
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-
    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '22'
        cache: 'npm'
    - name: Cache Docker base image
      id: docker-cache
      uses: actions/cache@v5
      with:
        path: /tmp/docker-images
        key: docker-tomcat-11-jdk25-${{ hashFiles('Dockerfile') }}
        restore-keys: docker-tomcat-11-jdk25-
    - name: Load or pull Docker base image
      run: |
        if [ -f /tmp/docker-images/tomcat-11-jdk25.tar ]; then
          docker load < /tmp/docker-images/tomcat-11-jdk25.tar
        else
          docker pull tomcat:11-jdk25
          mkdir -p /tmp/docker-images
          docker save tomcat:11-jdk25 > /tmp/docker-images/tomcat-11-jdk25.tar
        fi
    - name: Build WAR for Docker image
      run: mvn -B package -Pwar,production -DskipTests
    - name: Run Docker Integration Tests
      run: mvn -B verify -Pdocker-it -Dsurefire.skip=true
